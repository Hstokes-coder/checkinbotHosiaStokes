name: Scheduled Check-In Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checkin-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
      PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
      INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect instructor posts (Task 1)
        run: python collect_posts.py

      - name: Reply to check-ins (Task 2)
        run: python checkin_bot.py

      - name: Commit and push artifact/ results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact/
          git diff --cached --quiet || git commit -m "Update artifact/ results [skip ci]"
          git push
